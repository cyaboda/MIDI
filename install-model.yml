name: Instalar modelo Basic Pitch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Descargar modelo oficial de npm
        run: |
          npm pack @spotify/basic-pitch@1.0.1 --pack-destination /tmp
          mkdir -p /tmp/basic-pitch-pkg
          tar -xzf /tmp/spotify-basic-pitch-1.0.1.tgz -C /tmp/basic-pitch-pkg
          test -s /tmp/basic-pitch-pkg/package/model/model.json
          mkdir -p model
          cp -R /tmp/basic-pitch-pkg/package/model/. model/
      - name: Publicar archivos del modelo en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f model/
          git diff --cached --quiet || (git commit -m 'Add official Basic Pitch model' && git push)
